spring.application.name=myBlog

# Server
server.port=8080

# DataSource - MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# MyBatis
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=com.tlj.myblog.model.entity

# SQL init (schema.sql)
spring.sql.init.mode=always

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200

# Knife4j/Swagger basic openapi info (可按需)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
